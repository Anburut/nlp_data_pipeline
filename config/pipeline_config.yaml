pipeline:
  - step: "cleaning"
    params:
      lowercase: true
      normalize_whitespace: true

  - step: "linguistic"
    params: {}

  - step: "validation"
    params:
      allowed_langs: ["en,om"]

  - step: "filtering"
    params:
      min_ratio: 0.8
      max_ratio: 3.5

  - step: "tokenization"
    params:
      type: "whitespace"
